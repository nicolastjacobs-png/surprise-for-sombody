<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#120d1c">
<title>A Surprise for Willow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500;1,600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #120d1c;
  --plum: #2b1a3a;
  --wine: #5a2347;
  --rose: #eaa3b8;
  --gold: #d8b574;
  --gold-soft: rgba(216, 181, 116, .35);
  --pearl: #f7ede8;
  --pearl-dim: rgba(247, 237, 232, .74);
  --glass: rgba(255, 246, 248, .06);
  --glass-edge: rgba(255, 255, 255, .13);
  --display: "Cormorant Garamond", Georgia, serif;
  --body: "Karla", system-ui, -apple-system, "Segoe UI", sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { background: var(--ink); -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  color: var(--pearl);
  font-family: var(--body);
  font-size: 1.05rem;
  line-height: 1.6;
  text-align: center;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse 90% 55% at 50% -5%, rgba(180, 70, 120, .55), transparent 70%),
    radial-gradient(ellipse 80% 50% at 50% 110%, rgba(90, 35, 71, .75), transparent 70%),
    linear-gradient(180deg, #1b1228 0%, var(--ink) 100%);
  background-attachment: fixed;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- Effect layers ---------- */

#sky, #petals, #fxlayer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}
#sky { z-index: 0; }
#petals { z-index: 20; }
#fxlayer { z-index: 40; }

#confetti {
  position: fixed;
  inset: 0;
  z-index: 30;
  pointer-events: none;
}

.star {
  position: absolute;
  border-radius: 50%;
  background: var(--pearl);
  opacity: .15;
  animation: twinkle 4s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: .1; transform: scale(.8); }
  50% { opacity: .85; transform: scale(1.15); }
}

.petal {
  position: absolute;
  bottom: -50px;
  color: var(--rose);
  opacity: .55;
  animation: drift linear forwards;
}
.petal.big { opacity: .8; }
@keyframes drift {
  to { transform: translate3d(var(--sway, 30px), -115vh, 0) rotate(300deg); opacity: 0; }
}

.sparkle {
  position: absolute;
  color: var(--gold);
  opacity: 0;
  text-shadow: 0 0 10px rgba(216, 181, 116, .9);
  transform: translate(-50%, -50%);
  animation: spark 1.2s ease-out forwards;
}
@keyframes spark {
  0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
  20% { opacity: 1; }
  100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1) rotate(90deg); }
}

.trail {
  position: absolute;
  color: var(--rose);
  opacity: 0;
  transform: translate(-50%, -50%);
  animation: trail 1.3s ease-out forwards;
}
@keyframes trail {
  0% { opacity: .9; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, calc(-50% - 46px)) scale(.4); }
}

/* ---------- Screens ---------- */

.screen {
  display: none;
  position: relative;
  z-index: 1;
  min-height: 100vh;
  min-height: 100dvh;
  padding:
    calc(40px + var(--safe-top))
    calc(20px + var(--safe-right))
    calc(56px + var(--safe-bottom))
    calc(20px + var(--safe-left));
  align-items: center;
  justify-content: center;
  flex-direction: column;
}
.screen.active {
  display: flex;
  animation: enter .8s ease both;
}
@keyframes enter {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}

.wrap { width: 100%; max-width: 520px; margin: 0 auto; }

h1, h2, h3 {
  font-family: var(--display);
  font-weight: 500;
  font-style: italic;
  line-height: 1.08;
  margin: 0;
  text-wrap: balance;
}
h1 { font-size: clamp(2.5rem, 10vw, 3.9rem); }
h2 { font-size: clamp(1.9rem, 7vw, 2.4rem); }
h1:focus, h2:focus { outline: none; }

p { margin: 0 0 1rem; max-width: 34em; margin-inline: auto; text-wrap: pretty; }

.muted { color: var(--pearl-dim); }
.small { font-size: .92rem; }

/* ---------- Buttons and inputs ---------- */

button { font: inherit; color: inherit; touch-action: manipulation; }

.btn {
  appearance: none;
  border: 0;
  cursor: pointer;
  min-height: 50px;
  padding: 14px 34px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 1rem;
  color: #3a1530;
  background: linear-gradient(135deg, #f0d79e, var(--gold) 55%, #c19a58);
  box-shadow: 0 8px 26px rgba(216, 181, 116, .28), inset 0 1px 0 rgba(255,255,255,.5);
  transition: transform .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(216, 181, 116, .38), inset 0 1px 0 rgba(255,255,255,.5); }
.btn:active { transform: translateY(0); }

.btn-ghost {
  appearance: none;
  background: none;
  border: 1px solid var(--glass-edge);
  color: var(--pearl-dim);
  min-height: 44px;
  padding: 8px 20px;
  border-radius: 999px;
  cursor: pointer;
  font-size: .95rem;
  transition: border-color .2s, color .2s;
}
.btn-ghost:hover { border-color: var(--gold); color: var(--pearl); }

input {
  width: min(320px, 100%);
  min-height: 52px;
  padding: 14px 18px;
  margin: 8px 0 14px;
  font: inherit;
  font-size: max(16px, 1.05rem);
  text-align: center;
  letter-spacing: .06em;
  color: var(--pearl);
  background: rgba(10, 6, 18, .45);
  border: 1px solid var(--gold-soft);
  border-radius: 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
input::placeholder { color: rgba(247, 237, 232, .42); letter-spacing: .02em; }
input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(216, 181, 116, .14); }

:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.feedback { min-height: 1.7em; margin: 12px auto 0; color: var(--rose); }

/* ---------- Mute button ---------- */

.mute {
  position: fixed;
  z-index: 50;
  top: calc(18px + var(--safe-top));
  right: calc(16px + var(--safe-right));
  width: 46px;
  height: 46px;
  padding: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  cursor: pointer;
  color: var(--pearl);
  background: rgba(20, 12, 30, .55);
  border: 1px solid var(--glass-edge);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: border-color .2s, color .2s;
}
.mute[hidden] { display: none; }
.mute:hover { border-color: var(--gold); }
.mute .cross { display: none; }
.mute.is-muted { color: var(--pearl-dim); }
.mute.is-muted .waves { display: none; }
.mute.is-muted .cross { display: block; }

/* ---------- Glass cards ---------- */

.card {
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  border-radius: 26px;
  padding: 26px 24px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
}

/* ---------- Lock screen ---------- */

.seal {
  width: 104px;
  height: 104px;
  margin: 0 auto 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 46px;
  color: #fbe3ea;
  background: radial-gradient(circle at 35% 30%, #a23a68, var(--wine) 60%, #3c1330);
  border: 2px solid var(--gold);
  box-shadow: 0 0 0 8px rgba(216, 181, 116, .1), 0 0 50px rgba(190, 70, 120, .5);
  animation: beat 2.6s ease-in-out infinite;
}
@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.07); }
}

#start h1 { margin-bottom: 14px; }
#start .lede { font-size: 1.12rem; margin-bottom: 26px; }
#start .card { margin-bottom: 8px; }
#start .card h2 { font-size: 1.6rem; margin-bottom: 10px; }

/* ---------- Gift screen ---------- */

.gift-btn {
  appearance: none;
  border: 0;
  background: none;
  cursor: pointer;
  font-size: 128px;
  line-height: 1;
  margin: 20px 0 6px;
  padding: 8px 16px;
  filter: drop-shadow(0 18px 30px rgba(190, 70, 120, .45));
  animation: bob 3.2s ease-in-out infinite;
  transition: transform .3s;
}
.gift-btn:hover { transform: rotate(-6deg) scale(1.08); }
@keyframes bob {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -10px; }
}

/* ---------- Hub of presents ---------- */

#panelsScreen { justify-content: flex-start; padding-top: calc(60px + var(--safe-top)); }
#panelsScreen h1 { margin-bottom: 12px; }

.hub-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  margin: 30px auto 8px;
  max-width: 400px;
}

.present {
  appearance: none;
  position: relative;
  cursor: pointer;
  padding: 22px 10px 18px;
  min-height: 150px;
  border-radius: 24px;
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  transition: transform .25s, border-color .25s, background .25s;
}
.present:hover { transform: translateY(-4px); border-color: var(--gold-soft); background: rgba(255, 246, 248, .1); }
.present .icon { font-size: 50px; line-height: 1.1; }
.present .name { font-family: var(--display); font-style: italic; font-size: 1.4rem; margin-top: 4px; }
.present .status { font-size: .82rem; color: var(--pearl-dim); }
.present.complete { border-color: var(--gold); background: linear-gradient(160deg, rgba(216, 181, 116, .16), rgba(216, 181, 116, .03)); }
.present.complete .status { color: var(--gold); }
.present.ready {
  border-color: var(--gold);
  background: linear-gradient(160deg, rgba(216, 181, 116, .16), rgba(216, 181, 116, .03));
  animation: readyGlow 3.2s ease-in-out infinite;
}
.present.ready .status { color: var(--gold); }
@keyframes readyGlow {
  0%, 100% { box-shadow: 0 0 0 rgba(216, 181, 116, 0); }
  50% { box-shadow: 0 0 34px rgba(216, 181, 116, .35); }
}
.present.nudge { animation: wiggle 1.2s ease; }
@keyframes wiggle {
  15% { transform: rotate(-3deg) scale(1.03); }
  35% { transform: rotate(3deg) scale(1.03); }
  55% { transform: rotate(-2deg); }
  75% { transform: rotate(1.5deg); }
}
.present.celebrate { animation: cardGlow 2.6s ease; }
.present.celebrate::after {
  content: "";
  position: absolute;
  inset: -2px;
  border-radius: 26px;
  border: 2px solid var(--gold);
  pointer-events: none;
  animation: ringOut 1.8s ease-out;
}
.present.celebrate .icon { animation: iconHop 1.2s ease; }
@keyframes cardGlow {
  0% { box-shadow: 0 0 0 0 rgba(216, 181, 116, .8); transform: scale(1); }
  25% { box-shadow: 0 0 0 16px rgba(216, 181, 116, 0), 0 0 80px rgba(216, 181, 116, .75); transform: scale(1.1); }
  60% { box-shadow: 0 0 50px rgba(216, 181, 116, .4); transform: scale(1.03); }
  100% { box-shadow: 0 0 0 0 rgba(216, 181, 116, 0), 0 0 0 rgba(216, 181, 116, 0); transform: scale(1); }
}
@keyframes ringOut {
  from { opacity: .9; transform: scale(1); }
  to { opacity: 0; transform: scale(1.4); }
}
@keyframes iconHop {
  30% { transform: translateY(-14px) rotate(-8deg); }
  60% { transform: translateY(0) rotate(5deg); }
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(24px + var(--safe-bottom));
  z-index: 50;
  translate: -50% 20px;
  opacity: 0;
  padding: 12px 24px;
  border-radius: 999px;
  background: rgba(20, 12, 30, .88);
  border: 1px solid var(--gold-soft);
  color: var(--pearl);
  font-size: .95rem;
  pointer-events: none;
  transition: opacity .4s, translate .4s;
}
.toast.show { opacity: 1; translate: -50% 0; }

/* ---------- Panels ---------- */

.panel { display: none; width: 100%; max-width: 520px; margin: 0 auto; text-align: center; }
.panel.open { display: block; animation: enter .6s ease both; }

.panel-top { display: flex; justify-content: flex-start; margin-bottom: 18px; }
.panel h2 { margin-bottom: 10px; }
.panel .intro { margin-bottom: 22px; }

.token-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 0 auto 20px;
}

.token {
  appearance: none;
  position: relative;
  cursor: pointer;
  min-height: 104px;
  padding: 16px 6px 12px;
  border-radius: 22px;
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  transition: transform .25s, border-color .25s, background .25s;
}
.token:hover { transform: translateY(-3px); border-color: var(--gold-soft); }
.token:active { transform: scale(.96); }
.token .emoji { font-size: 38px; line-height: 1.15; }
.token .label { font-size: .82rem; color: var(--pearl-dim); }
.token.found {
  background: linear-gradient(160deg, rgba(234, 163, 184, .22), rgba(234, 163, 184, .06));
  border-color: rgba(234, 163, 184, .6);
}
.token.found::after {
  content: "♥";
  position: absolute;
  top: 7px;
  right: 10px;
  font-size: .8rem;
  color: var(--rose);
}
.token.pop { animation: pop .45s ease; }
@keyframes pop {
  40% { transform: scale(1.1); }
}

.dots { display: flex; justify-content: center; gap: 9px; margin-bottom: 4px; }
.dots span {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1px solid var(--gold-soft);
  transition: background .3s, border-color .3s, transform .3s;
}
.dots span.on { background: var(--gold); border-color: var(--gold); transform: scale(1.1); }
.count { font-size: .85rem; color: var(--pearl-dim); margin-bottom: 14px; }

.whisper {
  min-height: 4.8em;
  display: grid;
  place-items: center;
  margin: 0 auto;
  max-width: 28em;
  font-family: var(--display);
  font-style: italic;
  font-size: 1.4rem;
  line-height: 1.3;
  color: var(--pearl);
}
.whisper.swap { animation: swap .5s ease; }
@keyframes swap {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

/* Hidden number card */

.clue-slot { min-height: 190px; display: grid; place-items: center; margin-top: 4px; }
.clue {
  position: relative;
  min-width: 200px;
  padding: 14px 30px 14px;
  border-radius: 20px;
  border: 1px solid var(--gold);
  background: linear-gradient(160deg, rgba(216, 181, 116, .28), rgba(216, 181, 116, .06));
  box-shadow: 0 0 40px rgba(216, 181, 116, .22);
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px) scale(.94);
  transition: opacity .45s, transform .45s, visibility 0s .45s;
}
.clue.show {
  opacity: 1;
  visibility: visible;
  transform: none;
  transition: opacity .45s, transform .45s;
}
.clue.show.pulse { animation: goldPulse 2.4s ease-out; }
@keyframes goldPulse {
  0% { box-shadow: 0 0 0 0 rgba(240, 215, 158, .85), 0 0 20px rgba(216, 181, 116, .4); }
  45% { box-shadow: 0 0 0 26px rgba(240, 215, 158, 0), 0 0 90px rgba(240, 215, 158, .6); }
  100% { box-shadow: 0 0 0 0 rgba(240, 215, 158, 0), 0 0 40px rgba(216, 181, 116, .22); }
}
.clue .tag { display: block; font-size: .78rem; color: var(--gold); }
.clue .num {
  display: block;
  font-family: var(--display);
  font-size: 3.6rem;
  font-weight: 600;
  line-height: 1.1;
  background: linear-gradient(100deg, #f7ede8 20%, #f0d79e 40%, #fff 50%, #f0d79e 60%, #f7ede8 80%);
  background-size: 250% 100%;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
}
.clue.show .num { animation: shimmer 2.8s ease-out; }
@keyframes shimmer {
  from { background-position: 100% 0; }
  to { background-position: 0 0; }
}
.clue .remember { display: block; font-size: .85rem; color: var(--pearl-dim); margin-bottom: 8px; }
.clue .copy {
  appearance: none;
  cursor: pointer;
  min-height: 40px;
  padding: 6px 20px;
  border-radius: 999px;
  font-size: .88rem;
  color: var(--pearl);
  background: rgba(10, 6, 18, .35);
  border: 1px solid var(--gold-soft);
  transition: border-color .2s;
}
.clue .copy:hover { border-color: var(--gold); }

.panel .note { margin: 18px auto 0; font-size: .9rem; color: var(--pearl-dim); }

/* ---------- Letter ---------- */

.letter {
  --paper-noise: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .3  0 0 0 0 .2  0 0 0 .3 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  display: none;
  position: relative;
  margin: 34px auto 0;
  padding: 46px 26px 26px;
  text-align: left;
  color: #3b2a33;
  background:
    linear-gradient(180deg, transparent 47%, rgba(80, 50, 30, .07) 50%, transparent 53%),
    var(--paper-noise),
    radial-gradient(ellipse at 50% 40%, #f8efe1, #efdfc8);
  border-radius: 4px;
  box-shadow: 0 22px 46px rgba(0, 0, 0, .5), inset 0 0 60px rgba(150, 100, 60, .18);
  transform: rotate(-.8deg);
  font-family: "Caveat", "Segoe Script", cursive;
  font-size: 1.42rem;
  line-height: 1.45;
}
.letter::before {
  content: "♥";
  position: absolute;
  top: -13px;
  left: 50%;
  translate: -50% 0;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  font-family: var(--body);
  font-size: 1.1rem;
  color: #f9d6e0;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #a23a68, var(--wine));
  box-shadow: 0 4px 10px rgba(0, 0, 0, .4);
}
.letter.show { display: block; animation: letterRise 1.3s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes letterRise {
  from { opacity: 0; transform: translateY(70px) rotate(-3deg) scale(.9); }
  to { opacity: 1; transform: rotate(-.8deg); }
}
.letter h3 { font-family: "Caveat", cursive; font-style: normal; font-size: 2.1rem; margin-bottom: 8px; }
.letter p { margin: 0 0 .8rem; max-width: none; }
.letter .sign { margin: 1rem 0 0; text-align: right; font-size: 1.7rem; }
.letter.show > * { animation: lineIn 1s ease both; animation-delay: calc(.8s + var(--i, 0) * .6s); }
@keyframes lineIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}
.letter.instant, .letter.instant > * { animation: none !important; }

/* ---------- Final present ---------- */

.lock-heart {
  appearance: none;
  border: 0;
  background: none;
  cursor: pointer;
  font-size: 66px;
  line-height: 1;
  margin: 6px 0 10px;
  padding: 6px 14px;
  filter: drop-shadow(0 8px 20px rgba(190, 70, 120, .5));
  transition: transform .3s;
}
.lock-heart:hover { transform: scale(1.1); }

.countdown {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  max-width: 340px;
  margin: 18px auto 22px;
}
.countdown div {
  padding: 12px 4px 8px;
  border-radius: 14px;
  background: rgba(10, 6, 18, .4);
  border: 1px solid var(--glass-edge);
}
.countdown b {
  display: block;
  font-family: var(--display);
  font-size: 1.9rem;
  font-weight: 600;
  line-height: 1.1;
}
.countdown small { font-size: .74rem; color: var(--pearl-dim); }
.countdown-done { margin: 18px auto 22px; color: var(--gold); font-family: var(--display); font-style: italic; font-size: 1.5rem; }

/* ---------- Proposal ---------- */

#proposal {
  background:
    radial-gradient(circle at 50% 30%, rgba(216, 181, 116, .18), transparent 55%),
    radial-gradient(circle at 50% 50%, rgba(180, 70, 120, .3), transparent 70%);
}

.ring-wrap {
  position: relative;
  width: 150px;
  height: 130px;
  margin: 0 auto 10px;
  display: grid;
  place-items: center;
}

.rays {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 620px;
  height: 620px;
  margin: -310px 0 0 -310px;
  border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(216, 181, 116, .2) 0 5deg, transparent 5deg 16deg);
  -webkit-mask-image: radial-gradient(circle, #000 0, transparent 62%);
  mask-image: radial-gradient(circle, #000 0, transparent 62%);
  opacity: 0;
  transition: opacity 3s ease;
  animation: spin 50s linear infinite;
  pointer-events: none;
}
.rays.in { opacity: 1; }
@keyframes spin { to { transform: rotate(360deg); } }

.ring {
  position: relative;
  font-size: 100px;
  line-height: 1;
  opacity: 0;
  transform: translateY(90px) scale(.55);
  filter: blur(10px) drop-shadow(0 0 0 rgba(216, 181, 116, 0));
  transition: opacity 2.2s ease, transform 2.8s cubic-bezier(.16, .84, .24, 1), filter 2.6s ease;
}
.ring.in {
  opacity: 1;
  transform: none;
  filter: blur(0) drop-shadow(0 0 34px rgba(216, 181, 116, .75));
  animation: ringFloat 4s ease-in-out 3s infinite;
}
@keyframes ringFloat {
  0%, 100% { translate: 0 0; }
  50% { translate: 0 -8px; }
}

.seq {
  opacity: 0;
  transform: translateY(16px);
  transition: opacity 1.6s ease, transform 1.6s ease, max-height 1.2s ease, margin 1.2s ease;
}
.seq.in { opacity: 1; transform: none; }
.seq.in.past { opacity: .55; }
.collapsible { max-height: 9em; }
.p-body.collapsible { max-height: 14em; }
.seq.gone { opacity: 0; max-height: 0; margin-top: 0; margin-bottom: 0; overflow: hidden; }

.p-name { font-family: var(--display); font-style: italic; font-size: clamp(2.4rem, 9vw, 3.4rem); line-height: 1.1; margin-bottom: 4px; }
.p-lead { font-family: var(--display); font-style: italic; font-size: 1.6rem; line-height: 1.25; }
#proposal p.p-body { font-size: 1.18rem; }

#pq {
  max-height: 20em;
  margin: 14px 0 28px;
  font-size: clamp(2.6rem, 11vw, 4.4rem);
  transition: opacity 1.8s ease, max-height 1.6s ease 1s, margin 1.6s ease 1s;
}
#pq.gone { opacity: 0; max-height: 0; margin-top: 0; margin-bottom: 0; overflow: hidden; }
#pq .w {
  display: inline-block;
  opacity: 0;
  transform: translateY(14px);
  filter: blur(8px);
  transition: opacity 1.3s ease var(--d), transform 1.3s ease var(--d), filter 1.3s ease var(--d);
}
#pq.in .w { opacity: 1; transform: none; filter: blur(0); }

.btn-yes {
  min-height: 58px;
  padding: 16px 60px;
  font-size: 1.2rem;
  animation: yesGlow 2.6s ease-in-out infinite;
}
@keyframes yesGlow {
  0%, 100% { box-shadow: 0 8px 26px rgba(216, 181, 116, .28), 0 0 0 0 rgba(240, 215, 158, .5), inset 0 1px 0 rgba(255,255,255,.5); }
  50% { box-shadow: 0 8px 36px rgba(216, 181, 116, .5), 0 0 0 16px rgba(240, 215, 158, 0), inset 0 1px 0 rgba(255,255,255,.5); }
}

#after { margin-top: 18px; }
.after-line {
  opacity: 0;
  transform: translateY(14px);
  transition: opacity 1.8s ease, transform 1.8s ease;
  font-family: var(--display);
  font-style: italic;
  font-size: clamp(1.9rem, 7vw, 2.5rem);
  line-height: 1.2;
  margin: 0 auto 10px;
  color: var(--gold);
}
.after-line.in { opacity: 1; transform: none; }
.after-line.soft { font-size: 1.4rem; color: var(--pearl); }
.after-line.sign { margin-top: 18px; font-family: "Caveat", "Segoe Script", cursive; font-style: normal; font-size: 2.2rem; color: var(--rose); }
.after-line.forever {
  margin-top: 28px;
  font-size: 1.15rem;
  color: var(--pearl-dim);
  letter-spacing: 0.04em;
}

/* Final settled state — calm, lasting, complete */
#proposal.settled .rays {
  animation-duration: 180s;
  opacity: .38;
  transition: opacity 4s ease;
}
#proposal.settled .ring.in {
  animation-duration: 9s;
  filter: blur(0) drop-shadow(0 0 32px rgba(216, 181, 116, .65));
}
#proposal.settled .after-line:not(.sign):not(.forever) {
  opacity: 0.68;
  transition: opacity 3.5s ease;
}
#proposal.settled .after-line.sign {
  opacity: 1;
}
#proposal.settled .after-line.forever {
  opacity: 1;
  transition: opacity 2.5s ease;
}

.token.again { animation: shake .45s ease; }
@keyframes shake {
  20% { transform: translateX(-4px); }
  40% { transform: translateX(4px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(2px); }
}

.clue.flash .num { animation: numFlash 1s ease; }
@keyframes numFlash {
  0% { transform: scale(1); filter: brightness(1); }
  30% { transform: scale(1.25); filter: brightness(1.6) drop-shadow(0 0 16px #f0d79e); }
  100% { transform: scale(1); filter: brightness(1); }
}

.seal.unlock { animation: unlockPop 1.1s ease forwards; }
@keyframes unlockPop {
  0% { transform: scale(1); }
  40% { transform: scale(1.3); box-shadow: 0 0 0 14px rgba(216, 181, 116, .2), 0 0 110px rgba(240, 215, 158, .9); }
  100% { transform: scale(1.12); opacity: .85; }
}

@media (max-width: 480px) {
  .countdown b { font-size: 2.3rem; }
  .countdown small { font-size: .8rem; }
  .countdown div { padding: 14px 2px 10px; }
}

@media (max-width: 380px) {
  .screen {
    padding-left: calc(14px + var(--safe-left));
    padding-right: calc(14px + var(--safe-right));
  }
  .token-grid { gap: 8px; }
  .token { min-height: 96px; padding: 12px 4px 10px; }
  .token .emoji { font-size: 32px; }
  .token .label { font-size: .76rem; }
  .letter { font-size: 1.3rem; }
  .clue { min-width: 170px; }
}

@media (max-height: 700px) {
  .ring-wrap { height: 100px; }
  .ring { font-size: 76px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01s !important;
    animation-iteration-count: 1 !important;
    animation-delay: 0s !important;
    transition-duration: .01s !important;
    transition-delay: 0s !important;
  }
  .rays { animation: none; }
}
</style>
</head>
